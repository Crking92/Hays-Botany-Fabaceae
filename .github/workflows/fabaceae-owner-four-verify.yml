name: Verify 4 Glass Root Garden source-original photos (no transfer)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/verify_fabaceae_owner_four.py'
      - '.github/workflows/fabaceae-owner-four-verify.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: shell
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: staging/fabaceae-metadata
          path: staged
          persist-credentials: false
      - name: Install image compare tools
        run: |
          python -m pip install 'Pillow>=10,<12' 'ImageHash>=4,<5'
          python -m py_compile shell/scripts/verify_fabaceae_owner_four.py
      - name: Read canonical original Fabaceae photo bytes
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth 1 --sparse --no-checkout \
            https://github.com/Crking92/Hays-County-Botany.git \
            "$RUNNER_TEMP/hays-source"
          git -C "$RUNNER_TEMP/hays-source" sparse-checkout set content/taxa/Fabaceae
          git -C "$RUNNER_TEMP/hays-source" checkout HEAD
          test "$(git -C "$RUNNER_TEMP/hays-source" rev-parse HEAD:content/taxa/Fabaceae)" = 947ac940c97f273db03e7b42f5dc992241871527
      - name: Verify individual photo IDs via current observation API, owner grant and image pixels
        run: python3 shell/scripts/verify_fabaceae_owner_four.py staged "$RUNNER_TEMP/hays-source" shell/qa-report/fabaceae-owner4
      - name: Save private review evidence as nonpublic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabaceae-owner4-source-photo-identity-audit
          path: shell/qa-report/fabaceae-owner4
          retention-days: 30
          if-no-files-found: warn
