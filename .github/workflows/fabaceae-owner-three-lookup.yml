name: Read-only observation lookup for three Calvin King Fabaceae photo originals
on:
  push:
    branches: [main]
    paths:
      - 'scripts/scout_fabaceae_owner_three_by_user_taxon.py'
      - '.github/workflows/fabaceae-owner-three-lookup.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: shell
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: staging/fabaceae-metadata
          path: staged
          persist-credentials: false
      - name: Install image comparison tools
        run: |
          python -m pip install 'Pillow>=10,<12' 'ImageHash>=4,<5'
          python -m py_compile shell/scripts/scout_fabaceae_owner_three_by_user_taxon.py
      - name: Read original photos from unchanged source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth 1 --sparse --no-checkout \
            https://github.com/Crking92/Hays-County-Botany.git \
            "$RUNNER_TEMP/hays-source"
          git -C "$RUNNER_TEMP/hays-source" sparse-checkout set content/taxa/Fabaceae
          git -C "$RUNNER_TEMP/hays-source" checkout HEAD
          test "$(git -C "$RUNNER_TEMP/hays-source" rev-parse HEAD:content/taxa/Fabaceae)" = 947ac940c97f273db03e7b42f5dc992241871527
      - name: Search owner observations for exact photo IDs and original pixel match
        run: python3 shell/scripts/scout_fabaceae_owner_three_by_user_taxon.py staged "$RUNNER_TEMP/hays-source" shell/qa-report/fabaceae-owner3
      - name: Save read-only source identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabaceae-owner-three-unlinked-exact-photo-evidence
          path: shell/qa-report/fabaceae-owner3
          retention-days: 30
          if-no-files-found: warn
