name: Verify deployed Fabaceae source photos, species cards and original bytes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-public-fabaceae-gallery.yml'
      - 'site/data/gallery-index.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fabaceae-public-live-proof
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify current live Fabaceae species cards and every approved image
        run: |
          python3 - <<'PY'
          import json,time,urllib.request,urllib.parse,urllib.error,pathlib,concurrent.futures
          BASE="https://crking92.github.io/Hays-Botany-Fabaceae/site/"
          site=pathlib.Path("site")
          expected=json.loads((site/"data/gallery-index.json").read_text())
          assert expected["species"]>=91 and expected["photo_count"]>=89 and expected["photo_species"]>=59
          expected_photos={}
          for item in json.loads((site/"data/collection-index.json").read_text())["entries"]:
              sid=item["id"]
              card=json.loads((site/"data/species"/(sid+".json")).read_text())
              for photo in card.get("verified_photos",[]):
                  assert photo["src"] not in expected_photos
                  expected_photos[photo["src"]]=(photo.get("creator"),photo.get("license"),photo.get("source_page"))
          local={p.relative_to(site).as_posix() for p in (site/"media").rglob("*") if p.is_file()}
          assert set(expected_photos)==local and len(local)==expected["photo_count"]
          def fetch(url):
              request=urllib.request.Request(url,headers={"User-Agent":"Hays-Botany-Fabaceae-Pages-ImageQA"})
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(request,timeout=22) as response:
                          assert response.status==200
                          return response.read()
                  except urllib.error.HTTPError as e:
                      if e.code not in (429,500,502,503,504) or attempt==5:
                          raise
                      print("Temporary Pages HTTP status",e.code,"on attempt",attempt+1,flush=True)
                  except (urllib.error.URLError,TimeoutError) as e:
                      if attempt==5:raise
                      print("Temporary Pages connection error",repr(e),flush=True)
                  time.sleep(min(2*(attempt+1),10))
          for attempt in range(56):
              try:
                  gallery=json.loads(fetch(BASE+"data/gallery-index.json"))
                  if (gallery["photo_count"]>=expected["photo_count"] and
                      gallery["photo_species"]>=expected["photo_species"] and
                      all(gallery["entries"][sid]["count"]>=e["count"]
                          for sid,e in expected["entries"].items())):
                      break
              except Exception as e:
                  print("Pages not ready",repr(e),flush=True)
              time.sleep(9)
          else:raise AssertionError("Fabaceae public gallery has not reached current release")
          catalog=json.loads(fetch(BASE+"data/collection-index.json"))
          assert len(catalog["entries"])==expected["species"]
          paths=set();photographed=0;panels=0
          for row in catalog["entries"]:
              sid=row["id"]
              photo_card=json.loads(fetch(BASE+"data/species/"+sid+".json"))
              photos=photo_card.get("verified_photos",[])
              assert len(photos)==gallery["entries"][sid]["count"],sid
              photographed+=bool(photos)
              panels+=len(photos)
              for photo in photos:
                  assert photo["src"].startswith("media/"+sid+"/")
                  assert photo.get("creator") and photo.get("source_page","").startswith("https://")
                  assert not photo.get("private_rights_review_only")
                  if photo.get("noncommercial_only"):
                      assert photo.get("license") in ("CC BY-NC 4.0","CC BY-NC-SA 4.0")
                      assert json.loads((site/"data/collection-meta.json").read_text()).get("photo_license_policy",{}).get("noncommercial_educational_use") is True
                  assert "ND" not in photo.get("license","").upper()
                  if not photo.get("noncommercial_only"):
                      assert "NC" not in photo.get("license","").upper()
                  src=photo["src"]
                  if src in expected_photos:
                      assert (photo.get("creator"),photo.get("license"),photo.get("source_page"))==expected_photos[src],src
                  assert src not in paths,src
                  paths.add(src)
          assert panels==gallery["photo_count"] and photographed==gallery["photo_species"]
          assert local.issubset(paths),(len(local),len(paths))
          def compare(path):
              actual=fetch(urllib.parse.urljoin(BASE,path))
              if path in local: assert actual==(site/path).read_bytes(),path
              return path
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as executor:
              results=list(executor.map(compare,sorted(paths)))
          assert len(results)==gallery["photo_count"]
          print("FABACEAE_PUBLIC_PAGES_EXISTING_IMAGE_PASS",json.dumps({
              "total_species":len(catalog["entries"]),"with_photos":photographed,
              "original_image_bytes_identical":len(local),"live_images_http_200":len(results),"new_photos_harvested_by_verification_job":0
          },sort_keys=True),flush=True)
          PY
