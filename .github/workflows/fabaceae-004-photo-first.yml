name: Fabaceae 004 — verify original photos and release eligible Zornia
on:
  push:
    branches: [main]
    paths:
      - 'scripts/stage_fabaceae_004.py'
      - '.github/workflows/fabaceae-004-photo-first.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fabaceae-photo-first-intake
  cancel-in-progress: false
jobs:
  verify-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: shell
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: staging/fabaceae-metadata
          path: staged
          persist-credentials: true
      - name: Check source validation program
        run: |
          python3 -m py_compile shell/scripts/stage_fabaceae_004.py
          python3 -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Verify five exact image licenses, identities and original hashes
        env:
          PUBLIC_DIR: shell
          STAGING_DIR: staged
          AUDIT_PATH: ${{ runner.temp }}/fabaceae_004_audit.json
        run: python3 shell/scripts/stage_fabaceae_004.py
      - name: Commit only verified publicly reusable photo bytes and credits to assigned family intake
        working-directory: staged
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photo-intake/approved/zornia-bracteata
          if git diff --cached --quiet; then
            echo "No new eligible source images. No publication was triggered."
            exit 0
          fi
          git diff --cached --check
          git commit -m "Verify original Fabaceae 004 Zornia photo rights and submit eligible media"
          git fetch origin staging/fabaceae-metadata
          git rebase FETCH_HEAD
          git push origin HEAD:refs/heads/staging/fabaceae-metadata
      - name: Preserve factual source-rights results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabaceae-004-photo-source-verification
          path: ${{ runner.temp }}/fabaceae_004_audit.json
          retention-days: 14
          if-no-files-found: ignore
