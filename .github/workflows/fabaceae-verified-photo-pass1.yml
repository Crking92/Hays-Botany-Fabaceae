name: Audit Fabaceae 200 original photos and stage only current-source verified CC (PRIVATE)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_and_archive_fabaceae_photos.py'
      - '.github/workflows/fabaceae-verified-photo-pass1.yml'
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: fabaceae-verified-photo-pass1
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout vetted source-verification script from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: shell
          persist-credentials: false
      - name: Checkout family text and rights staging branch
        uses: actions/checkout@v4
        with:
          ref: staging/fabaceae-metadata
          path: data-source
          persist-credentials: true
      - name: Install image hash and decoding tools
        run: |
          python -m pip install 'Pillow>=10,<12' 'ImageHash>=4,<5'
          python -m py_compile shell/scripts/audit_and_archive_fabaceae_photos.py
      - name: Clone authoritative source, exact Fabaceae subtree only
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth 1 --sparse --no-checkout \
            https://github.com/Crking92/Hays-County-Botany.git \
            "$RUNNER_TEMP/hays-photo-source"
          git -C "$RUNNER_TEMP/hays-photo-source" sparse-checkout set content/taxa/Fabaceae
          git -C "$RUNNER_TEMP/hays-photo-source" checkout HEAD
          test "$(git -C "$RUNNER_TEMP/hays-photo-source" rev-parse HEAD:content/taxa/Fabaceae)" = 947ac940c97f273db03e7b42f5dc992241871527
      - name: Audit each of 200 physical images with exact upstream identity, creator, license and pixels
        shell: bash
        run: |
          set -euo pipefail
          python3 shell/scripts/audit_and_archive_fabaceae_photos.py "$RUNNER_TEMP/hays-photo-source" data-source
          python3 data-source/scripts/validate_collection.py
      - name: Write private staging ledgers and only exact-source verified images
        shell: bash
        run: |
          set -euo pipefail
          cd data-source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Fabaceae/ migration/fabaceae-photo-200-decisions.json migration/fabaceae-verified-photo-ledger.json migration/fabaceae-photo-pass1-summary.json
          git diff --cached --check -- migration/fabaceae-photo-200-decisions.json migration/fabaceae-verified-photo-ledger.json migration/fabaceae-photo-pass1-summary.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit all 200 Fabaceae source photos; archive only verified public-compatible licensed originals"
            git fetch origin staging/fabaceae-metadata
            git rebase FETCH_HEAD
            git push origin HEAD:refs/heads/staging/fabaceae-metadata
          else
            echo "No new rights changes to stage."
          fi
      - name: Preserve audit outputs, not a deployed website
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabaceae-photo-200-first-pass-qa
          path: |
            data-source/migration/fabaceae-photo-200-decisions.json
            data-source/migration/fabaceae-verified-photo-ledger.json
            data-source/migration/fabaceae-photo-pass1-summary.json
          retention-days: 30
          if-no-files-found: warn
