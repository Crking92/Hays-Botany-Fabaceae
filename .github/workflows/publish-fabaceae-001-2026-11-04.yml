name: Publish verified Fabaceae 001 ZIP photos to public family learner
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-fabaceae-001-2026-11-04.yml'
      - 'scripts/publish_verified_fabaceae_001_zip.py'
      - 'photo-intake/remote-photo-manifests/fabaceae-001-2026-11-04.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fabaceae-001-2026-11-04-verified-photo-publish
  cancel-in-progress: false
jobs:
  source-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Image validation dependencies
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Verify source rights, prevent duplicate downloads, and publish in five bounded waves
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/publish_verified_fabaceae_001_zip.py scripts/publish_approved_family_photos.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          publish_wave() {
            local wave="$1"
            local cleared="$RUNNER_TEMP/fabaceae-001-approved-$wave"
            local report="$RUNNER_TEMP/fabaceae-001-rights-$wave.json"
            python3 scripts/publish_verified_fabaceae_001_zip.py \
              --manifest photo-intake/remote-photo-manifests/fabaceae-001-2026-11-04.json \
              --wave "$wave" --source-root "$cleared" --report "$report"
            for attempt in $(seq 1 12); do
              python3 scripts/publish_approved_family_photos.py --source-root "$cleared" --site-root site --check
              python3 scripts/publish_approved_family_photos.py --source-root "$cleared" --site-root site
              python3 - <<'PY'
          import json,pathlib
          site=pathlib.Path("site")
          index=json.loads((site/"data/gallery-index.json").read_text())
          catalog=json.loads((site/"data/collection-index.json").read_text())
          assert len(catalog["entries"])==index["species"]==91
          assert sum(x["count"] for x in index["entries"].values())==index["photo_count"]
          assert sum(x["count"]>0 for x in index["entries"].values())==index["photo_species"]
          for sid,entry in index["entries"].items():
              card=json.loads((site/"data/species"/(sid+".json")).read_text())
              assert len(card.get("verified_photos",[]))==entry["count"],sid
              for photo in card.get("verified_photos",[]):
                  assert (site/photo["src"]).is_file(),photo["src"]
                  assert photo.get("creator") and photo.get("license") and photo.get("source_page")
          print("FABACEAE_001_LOCAL_GALLERY_CONSISTENT",index["photo_count"],index["photo_species"],flush=True)
          PY
              git add site/media site/data/species site/data/collection-index.json site/data/gallery-index.json
              if git diff --cached --quiet; then
                echo "FABACEAE_ALREADY_PUBLISHED wave=$wave"
                return 0
              fi
              git diff --cached --check
              git commit -m "Publish verified original Fabaceae 001 ZIP photographs (wave $wave)"
              if git push origin HEAD:main; then
                echo "FABACEAE_PUBLISHED_TO_GITHUB wave=$wave"
                return 0
              fi
              echo "Concurrent update detected; reapplying source-verified photos to current main (attempt=$attempt)"
              git fetch origin main
              git reset --hard origin/main
            done
            echo "Fabaceae 001 commit blocked after conflicting writes" >&2
            return 1
          }
          publish_wave 1
          publish_wave 2
          publish_wave 3
          publish_wave 4
          publish_wave 5
      - name: Preserve exact-photo rights and source audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabaceae-001-exact-source-rights-audit
          path: "${{ runner.temp }}/fabaceae-001-rights-*.json"
          if-no-files-found: warn
          retention-days: 30
