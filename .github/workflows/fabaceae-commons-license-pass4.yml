name: Recover Fabaceae Commons explicit CC0 and CC BY US originals (private)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/recover_fabaceae_commons_explicit_cc0_us.py'
      - '.github/workflows/fabaceae-commons-license-pass4.yml'
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: fabaceae-source-media-writes
  cancel-in-progress: false
jobs:
  source-license:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: shell
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: staging/fabaceae-metadata
          path: staged
          persist-credentials: true
      - name: Install image checks and syntax validate
        run: |
          python -m pip install 'Pillow>=10,<12' 'ImageHash>=4,<5'
          python -m py_compile shell/scripts/recover_fabaceae_commons_explicit_cc0_us.py
      - name: Read unchanged original source images
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth 1 --sparse --no-checkout \
            https://github.com/Crking92/Hays-County-Botany.git \
            "$RUNNER_TEMP/hays-source"
          git -C "$RUNNER_TEMP/hays-source" sparse-checkout set content/taxa/Fabaceae
          git -C "$RUNNER_TEMP/hays-source" checkout HEAD
          test "$(git -C "$RUNNER_TEMP/hays-source" rev-parse HEAD:content/taxa/Fabaceae)" = 947ac940c97f273db03e7b42f5dc992241871527
      - name: Recheck 8 held Commons CC0 and US-license files individually
        run: |
          python3 shell/scripts/recover_fabaceae_commons_explicit_cc0_us.py "$RUNNER_TEMP/hays-source" staged
          python3 staged/scripts/validate_collection.py
      - name: Commit verified originals and hold decisions only in private staging
        shell: bash
        run: |
          set -euo pipefail
          cd staged
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Fabaceae migration/fabaceae-verified-photo-ledger.json migration/fabaceae-photo-200-decisions.json migration/fabaceae-commons-explicit-cc0-us-pass4.json
          git diff --cached --check -- migration/
          if ! git diff --cached --quiet; then
            git commit -m "Recover individually proven Commons CC0 / CC BY 3.0 US Fabaceae images"
            git fetch origin staging/fabaceae-metadata
            git rebase FETCH_HEAD
            git push origin HEAD:refs/heads/staging/fabaceae-metadata
          fi
      - name: Save license and source-audit report without Pages deployment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabaceae-commons-explicit-license-pass4
          path: staged/migration/fabaceae-commons-explicit-cc0-us-pass4.json
          retention-days: 30
          if-no-files-found: warn
