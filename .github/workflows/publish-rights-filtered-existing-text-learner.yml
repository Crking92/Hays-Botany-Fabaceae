name: Deprecated text-only publisher guard — preserve visual gallery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-rights-filtered-existing-text-learner.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preserve-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify the published existing-source photo gallery remains intact
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('site')
          index=json.loads((root/'data/collection-index.json').read_text())
          gallery=json.loads((root/'data/gallery-index.json').read_text())
          report=json.loads((root/'photo-source-migration-report.json').read_text())
          assert len(index['entries'])==gallery['species']==report['species']
          assert gallery['photo_count']==report['photos_copied_and_eligible']>0
          assert gallery['photo_species']==report['species_with_photos']>0
          approved=set()
          for row in index['entries']:
              card=json.loads((root/'data/species'/(row['id']+'.json')).read_text())
              pictures=card['verified_photos']
              assert len(pictures)==gallery['entries'][row['id']]['count']
              for pic in pictures:
                  assert pic['src'].startswith('media/'+row['id']+'/')
                  assert pic['creator'] and pic['license_url'] and pic['source_page']
                  target=root/pic['src']
                  assert target.is_file()
                  approved.add(target.resolve())
          actual={p.resolve() for p in (root/'media').rglob('*') if p.is_file()}
          assert actual==approved
          print('PASS: Legacy text-only publisher retired. Source photo gallery preserved;',
                gallery['photo_count'],'photos across',gallery['photo_species'],'species.')
          PY
