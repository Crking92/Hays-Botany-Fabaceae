name: Check 25 Fabaceae photo IDs and original owner records (read only)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/scout_fabaceae_inat_owner_links.py'
      - '.github/workflows/fabaceae-inat25-source-scout.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Read current photo-ID checking script
        uses: actions/checkout@v4
        with:
          ref: main
          path: shell
          persist-credentials: false
      - name: Read private source-photo migration decisions
        uses: actions/checkout@v4
        with:
          ref: staging/fabaceae-metadata
          path: staged
          persist-credentials: false
      - name: Install image verifier
        run: |
          python -m pip install 'Pillow>=10,<12' 'ImageHash>=4,<5'
          python -m py_compile shell/scripts/scout_fabaceae_inat_owner_links.py
      - name: Obtain canonical original photos for exact comparison
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth 1 --sparse --no-checkout \
            https://github.com/Crking92/Hays-County-Botany.git \
            "$RUNNER_TEMP/hays-source"
          git -C "$RUNNER_TEMP/hays-source" sparse-checkout set content/taxa/Fabaceae
          git -C "$RUNNER_TEMP/hays-source" checkout HEAD
          test "$(git -C "$RUNNER_TEMP/hays-source" rev-parse HEAD:content/taxa/Fabaceae)" = 947ac940c97f273db03e7b42f5dc992241871527
      - name: Investigate exact current observation, image, photographer and license
        run: |
          python3 shell/scripts/scout_fabaceae_inat_owner_links.py staged "$RUNNER_TEMP/hays-source" shell/qa-report/inat25
      - name: Preserve results as evidence without approving or copying any photos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabaceae-inat25-original-photo-link-evidence
          path: shell/qa-report/inat25
          retention-days: 30
          if-no-files-found: warn
