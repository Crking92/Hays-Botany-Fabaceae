name: Archive 35 source and pixel verified Fabaceae GBIF originals privately (never deploy)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/archive_verified_fabaceae_gbif43.py'
      - '.github/workflows/fabaceae-gbif43-archive-verified.yml'
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: fabaceae-verified-photo-staging-write
  cancel-in-progress: false
jobs:
  gbif-source-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: shell
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: staging/fabaceae-metadata
          path: staged
          persist-credentials: true
      - name: Clone authoritative source originals without changing them
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth 1 --sparse --no-checkout \
            https://github.com/Crking92/Hays-County-Botany.git \
            "$RUNNER_TEMP/hays-source"
          git -C "$RUNNER_TEMP/hays-source" sparse-checkout set content/taxa/Fabaceae
          git -C "$RUNNER_TEMP/hays-source" checkout HEAD
          test "$(git -C "$RUNNER_TEMP/hays-source" rev-parse HEAD:content/taxa/Fabaceae)" = 947ac940c97f273db03e7b42f5dc992241871527
      - name: Cross-check previous independent source/rights/pixel proof and archive 35 files
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile shell/scripts/archive_verified_fabaceae_gbif43.py
          python3 shell/scripts/archive_verified_fabaceae_gbif43.py "$RUNNER_TEMP/hays-source" staged
          python3 staged/scripts/validate_collection.py
      - name: Commit only private photos and exact licensing ledger
        shell: bash
        run: |
          set -euo pipefail
          cd staged
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Fabaceae/ migration/fabaceae-photo-200-decisions.json migration/fabaceae-verified-photo-ledger.json migration/fabaceae-photo-pass3-gbif-summary.json
          git diff --cached --check -- migration/
          if ! git diff --cached --quiet; then
            git commit -m "Archive 35 confirmed GBIF Fabaceae photos with exact current multimedia rights"
            git fetch origin staging/fabaceae-metadata
            git rebase FETCH_HEAD
            git push origin HEAD:refs/heads/staging/fabaceae-metadata
          fi
      - name: Save private audit summary; no public website publishing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabaceae-gbif35-byte-verified-archive
          path: staged/migration/fabaceae-photo-pass3-gbif-summary.json
          retention-days: 30
          if-no-files-found: warn
